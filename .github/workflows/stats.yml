name: Generate stats images

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with: { repository: jstrieb/github-stats, ref: ef574fae2ce8311f3e1ebb43e07c0c0fae0a41b6, path: .gh-stats-src }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with: { version: 0.16.0 }
      - name: Build github-stats
        run: |
          (cd .gh-stats-src && zig build)
          mv .gh-stats-src/zig-out/bin/github-stats "$RUNNER_TEMP/github-stats"
          rm -rf .gh-stats-src

      - name: Switch to generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin generated; then
            git checkout -B generated origin/generated
          else
            git checkout --orphan generated
            git rm -rf --quiet .
          fi

      - name: Generate images
        run: '"$RUNNER_TEMP/github-stats"'
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_PRIVATE: "true"
          SILENT: "true"
          MAX_RETRIES: 5

      - name: Commit images
        run: |
          git add overview.svg languages.svg
          git commit -m "Update generated stats" || true
          git push origin generated
